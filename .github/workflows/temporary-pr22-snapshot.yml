name: Temporary PR 22 finalizer

on:
  push:
    branches: [chore/release-security-lock]

concurrency:
  group: temporary-pr22-finalizer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,security,release]'
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path("src/julesctl/store.py")
          text = store.read_text(encoding="utf-8")
          replacements = [
              (
                  "_ROLLING_24H_CUTOFF_SQL = \"strftime('%Y-%m-%dT%H:%M:%SZ','now','-24 hours')\"\n",
                  """_UNRESOLVED_ATTEMPT_COUNT_SQL = (\n    \"SELECT COUNT(*) AS n FROM dispatch_attempts \"\n    \"WHERE state IN (?,?,?,?,?)\"\n)\n_ROLLING_24H_COUNT_SQL = (\n    \"SELECT COUNT(*) AS n FROM dispatch_attempts \"\n    \"WHERE send_started_at >= strftime('%Y-%m-%dT%H:%M:%SZ','now','-24 hours')\"\n)\n""",
              ),
              (
                  '''        row = self._conn.execute(\n            "SELECT COUNT(*) AS n FROM dispatch_attempts "\n            f"WHERE send_started_at >= {_ROLLING_24H_CUTOFF_SQL}"\n        ).fetchone()\n''',
                  '''        row = self._conn.execute(_ROLLING_24H_COUNT_SQL).fetchone()\n''',
              ),
              (
                  '''        marks = ",".join("?" for _ in _UNRESOLVED_ATTEMPT_STATES)\n        row = self._conn.execute(\n            f"SELECT COUNT(*) AS n FROM dispatch_attempts WHERE state IN ({marks})",\n            _UNRESOLVED_ATTEMPT_STATES,\n        ).fetchone()\n''',
                  '''        row = self._conn.execute(\n            _UNRESOLVED_ATTEMPT_COUNT_SQL,\n            _UNRESOLVED_ATTEMPT_STATES,\n        ).fetchone()\n''',
              ),
              (
                  '''                marks = ",".join("?" for _ in _UNRESOLVED_ATTEMPT_STATES)\n                unresolved = conn.execute(\n                    f"SELECT COUNT(*) AS n FROM dispatch_attempts WHERE state IN ({marks})",\n                    _UNRESOLVED_ATTEMPT_STATES,\n                ).fetchone()\n''',
                  '''                unresolved = conn.execute(\n                    _UNRESOLVED_ATTEMPT_COUNT_SQL,\n                    _UNRESOLVED_ATTEMPT_STATES,\n                ).fetchone()\n''',
              ),
              (
                  '''                recent = conn.execute(\n                    "SELECT COUNT(*) AS n FROM dispatch_attempts "\n                    f"WHERE send_started_at >= {_ROLLING_24H_CUTOFF_SQL}"\n                ).fetchone()\n''',
                  '''                recent = conn.execute(_ROLLING_24H_COUNT_SQL).fetchone()\n''',
              ),
              (
                  '''        placeholders = ",".join("?" for _ in missing)\n        self._conn.execute(\n            f"UPDATE sessions SET lifecycle='not_visible',last_observed_at=CURRENT_TIMESTAMP "\n            f"WHERE session_id IN ({placeholders})",\n            missing,\n        )\n''',
                  '''        with self.immediate() as conn:\n            conn.executemany(\n                "UPDATE sessions SET lifecycle='not_visible',"\n                "last_observed_at=CURRENT_TIMESTAMP WHERE session_id=?",\n                ((session_id,) for session_id in missing),\n            )\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"store marker count {count} for {old[:80]!r}")
              text = text.replace(old, new, 1)
          for forbidden in (
              "_ROLLING_24H_CUTOFF_SQL",
              'marks = ",".join',
              'placeholders = ",".join',
              'f"SELECT COUNT(*) AS n FROM dispatch_attempts WHERE state IN',
              'f"UPDATE sessions SET lifecycle=',
          ):
              if forbidden in text:
                  raise SystemExit(f"dynamic SQL marker remains: {forbidden}")
          store.write_text(text, encoding="utf-8")
          PY

          cat > src/julesctl/cli/common.py <<'PY'
          from __future__ import annotations

          import os
          import re
          import uuid

          import typer

          from ..domain.errors import (
              AdmissionError,
              ApiError,
              AuthError,
              IndeterminateError,
              InputError,
          )
          from .output import emit_json, err_console

          _URL_USERINFO = re.compile(r"(?i)(\b[a-z][a-z0-9+.-]*://)[^/@\s\"']+@")
          _HEADER_SECRET = re.compile(r"(?i)(x-goog-api-key\s*[:=]\s*)\S+")
          _ENV_SECRET = re.compile(r"(?i)(JULES_API_KEY\s*=\s*)\S+")


          def redact_text(value: str) -> str:
              """Remove known credential forms from diagnostics before they leave the process."""

              result = _URL_USERINFO.sub(r"\1[REDACTED]@", value)
              result = _HEADER_SECRET.sub(r"\1[REDACTED]", result)
              result = _ENV_SECRET.sub(r"\1[REDACTED]", result)
              api_key = os.environ.get("JULES_API_KEY", "")
              if api_key:
                  result = result.replace(api_key, "[REDACTED]")
              return result


          def error_kind(exc: Exception) -> str:
              if isinstance(exc, AuthError):
                  return "authentication_failed"
              if isinstance(exc, AdmissionError):
                  return "admission_denied"
              if isinstance(exc, IndeterminateError):
                  return "indeterminate"
              if isinstance(exc, InputError | ValueError):
                  return "invalid_input"
              if isinstance(exc, ApiError):
                  return "create_outcome_unknown" if exc.create_outcome_uncertain else "api_rejected"
              if isinstance(exc, OSError):
                  return "local_io_error"
              return "internal_error"


          def error_details(exc: Exception) -> dict[str, object]:
              value: dict[str, object] = {
                  "kind": error_kind(exc),
                  "message": redact_text(str(exc)),
              }
              if isinstance(exc, ApiError):
                  value.update(
                      {
                          "http_status": exc.http_status,
                          "api_status": exc.api_status,
                          "transient": exc.create_outcome_uncertain,
                          "safe_to_retry": False,
                          "reconcile_required": exc.create_outcome_uncertain,
                          "retry_after_seconds": exc.retry_after_seconds,
                      }
                  )
              elif isinstance(exc, IndeterminateError):
                  value.update(
                      {
                          "transient": True,
                          "safe_to_retry": False,
                          "reconcile_required": True,
                      }
                  )
              return value


          def fail(command: str, exc: Exception, *, machine: bool) -> None:
              if machine:
                  emit_json(
                      {
                          "schema": "julesctl.operation.v1",
                          "operation_id": str(uuid.uuid4()),
                          "command": command,
                          "outcome": "error",
                          "error": error_details(exc),
                      }
                  )
              else:
                  err_console.print(f"[red]{redact_text(str(exc))}[/red]")
              raise typer.Exit(getattr(exc, "exit_code", 2)) from exc
          PY

          cat > src/julesctl/git.py <<'PY'
          from __future__ import annotations

          import re
          import shutil
          import subprocess  # nosec B404
          from pathlib import Path
          from urllib.parse import urlsplit

          from .domain.errors import InputError

          _SCP_GITHUB = re.compile(r"^(?:[^@/]+@)?github\.com:(?P<path>[^?#]+)$", re.IGNORECASE)


          def _normalize_repo_path(path: str) -> str:
              candidate = path.strip().strip("/")
              if candidate.endswith(".git"):
                  candidate = candidate[:-4]
              parts = candidate.split("/")
              if len(parts) != 2 or not all(parts):
                  raise InputError(f"GitHub remote must identify owner/repo: {path!r}")
              return f"{parts[0]}/{parts[1]}"


          def parse_github_remote(remote: str) -> str:
              """Return canonical owner/repo from common GitHub remote URL forms."""

              value = remote.strip()
              if not value:
                  raise InputError("Git remote URL is empty")
              scp = _SCP_GITHUB.fullmatch(value)
              if scp:
                  return _normalize_repo_path(scp.group("path"))

              parsed = urlsplit(value)
              if parsed.hostname and parsed.hostname.casefold() == "github.com":
                  return _normalize_repo_path(parsed.path)
              raise InputError("origin is not a GitHub repository")


          def _run_git(args: list[str], *, cwd: Path) -> str:
              git_executable = shutil.which("git")
              if git_executable is None:
                  raise InputError("git executable was not found on PATH")
              try:
                  completed = subprocess.run(  # nosec B603
                      [git_executable, *args],
                      cwd=cwd,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=10,
                      shell=False,
                  )
              except (OSError, subprocess.TimeoutExpired) as exc:
                  raise InputError(f"unable to run git: {exc}") from exc
              if completed.returncode != 0:
                  detail = completed.stderr.strip() or completed.stdout.strip() or "git command failed"
                  raise InputError(detail)
              return completed.stdout.strip()


          def infer_github_repo(*, cwd: Path | None = None) -> str:
              root = (cwd or Path.cwd()).resolve()
              return parse_github_remote(_run_git(["remote", "get-url", "origin"], cwd=root))


          def infer_branch(*, cwd: Path | None = None) -> str:
              root = (cwd or Path.cwd()).resolve()
              branch = _run_git(["branch", "--show-current"], cwd=root)
              if not branch:
                  raise InputError("Git is in detached HEAD state; pass --branch or --default-branch")
              return branch
          PY

          cat > tests/test_git.py <<'PY'
          from pathlib import Path
          from types import SimpleNamespace

          import pytest

          import julesctl.git as git_module
          from julesctl.domain.errors import InputError
          from julesctl.git import infer_branch, infer_github_repo, parse_github_remote


          @pytest.mark.parametrize(
              ("remote", "expected"),
              [
                  ("https://github.com/EffortlessMetrics/julesctl.git", "EffortlessMetrics/julesctl"),
                  ("git@github.com:EffortlessMetrics/julesctl.git", "EffortlessMetrics/julesctl"),
                  ("ssh://git@github.com/EffortlessMetrics/julesctl.git", "EffortlessMetrics/julesctl"),
                  ("git://github.com/EffortlessMetrics/julesctl", "EffortlessMetrics/julesctl"),
              ],
          )
          def test_parse_github_remote(remote: str, expected: str) -> None:
              assert parse_github_remote(remote) == expected


          @pytest.mark.parametrize(
              "remote",
              [
                  "https://gitlab.com/acme/repo.git",
                  "git@example.com:acme/repo.git",
                  "https://github.com/owner/too/many",
                  "",
              ],
          )
          def test_parse_github_remote_rejects_non_github_or_malformed(remote: str) -> None:
              with pytest.raises(InputError):
                  parse_github_remote(remote)


          def test_infer_repo_uses_origin(monkeypatch: pytest.MonkeyPatch, tmp_path: Path) -> None:
              observed: list[list[str]] = []

              def run(command: list[str], **_: object) -> SimpleNamespace:
                  observed.append(command)
                  return SimpleNamespace(returncode=0, stdout="git@github.com:acme/repo.git\n", stderr="")

              monkeypatch.setattr(git_module.shutil, "which", lambda command: "/tools/git")
              monkeypatch.setattr(git_module.subprocess, "run", run)
              assert infer_github_repo(cwd=tmp_path) == "acme/repo"
              assert observed == [["/tools/git", "remote", "get-url", "origin"]]


          def test_infer_branch_rejects_detached_head(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              monkeypatch.setattr(git_module.shutil, "which", lambda command: "/tools/git")
              monkeypatch.setattr(
                  git_module.subprocess,
                  "run",
                  lambda *_args, **_kwargs: SimpleNamespace(returncode=0, stdout="", stderr=""),
              )
              with pytest.raises(InputError, match="detached HEAD"):
                  infer_branch(cwd=tmp_path)


          def test_infer_repo_rejects_missing_git(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              monkeypatch.setattr(git_module.shutil, "which", lambda command: None)
              with pytest.raises(InputError, match="git executable was not found"):
                  infer_github_repo(cwd=tmp_path)
          PY

          cat > tests/test_error_contract.py <<'PY'
          from __future__ import annotations

          import json

          from typer.testing import CliRunner

          from julesctl.cli.app import app
          from julesctl.cli.common import error_details, redact_text
          from julesctl.domain.errors import ApiError, InputError

          runner = CliRunner()


          def test_redaction_removes_environment_and_header_forms(monkeypatch) -> None:
              monkeypatch.setenv("JULES_API_KEY", "super-secret-key")
              value = redact_text(
                  "JULES_API_KEY=super-secret-key x-goog-api-key: another-secret super-secret-key"
              )
              assert "super-secret-key" not in value
              assert "another-secret" not in value
              assert value.count("[REDACTED]") == 3


          def test_redaction_removes_url_userinfo_from_error_contract() -> None:
              remote = "https://git-user:remote-token@example.invalid/owner/repo.git"
              value = error_details(InputError(f"invalid origin: {remote}"))
              assert "git-user" not in value["message"]
              assert "remote-token" not in value["message"]
              assert "https://[REDACTED]@example.invalid/owner/repo.git" in value["message"]


          def test_error_contract_uses_stable_kinds_and_retry_evidence() -> None:
              invalid = error_details(InputError("bad input"))
              assert invalid["kind"] == "invalid_input"

              api = error_details(
                  ApiError(
                      "busy",
                      http_status=429,
                      api_status="RESOURCE_EXHAUSTED",
                      retry_after_seconds=7.0,
                  )
              )
              assert api == {
                  "kind": "create_outcome_unknown",
                  "message": "busy",
                  "http_status": 429,
                  "api_status": "RESOURCE_EXHAUSTED",
                  "transient": True,
                  "safe_to_retry": False,
                  "reconcile_required": True,
                  "retry_after_seconds": 7.0,
              }


          def test_queue_cli_uses_common_machine_error_contract(monkeypatch) -> None:
              monkeypatch.delenv("JULES_API_KEY", raising=False)
              result = runner.invoke(app, ["worker", "run-once", "--json"])
              assert result.exit_code == 3
              payload = json.loads(result.stdout)
              assert payload["schema"] == "julesctl.operation.v1"
              assert payload["error"]["kind"] == "authentication_failed"
          PY

      - name: Verify repository
        shell: bash
        run: |
          ruff format .
          ruff check .
          mypy
          python -m compileall -q src/julesctl
          pytest --cov=julesctl --cov-branch --cov-fail-under=65
          bandit -r src/julesctl -c pyproject.toml
          python -m pip_audit
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/julesctl-wheel
          /tmp/julesctl-wheel/bin/python -m pip install dist/*.whl
          /tmp/julesctl-wheel/bin/julesctl --help >/dev/null
          /tmp/julesctl-wheel/bin/python - <<'PY'
          import importlib.resources
          assert importlib.resources.files("julesctl").joinpath("py.typed").is_file()
          PY
      - name: Commit verified fixes
        shell: bash
        run: |
          git rm .github/workflows/temporary-pr22-snapshot.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: close release lock regressions'
          git push origin HEAD:${{ github.ref_name }}
