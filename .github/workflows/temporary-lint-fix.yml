name: Temporary lint fix

on:
  push:
    branches: [chore/repo-quality-ratchet]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Repair remaining lint debt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/store.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from typing import Iterator\n",
              "from collections.abc import Iterator\n",
          )
          text = text.replace(
              '"UPDATE dispatch_attempts SET state=\'CANCELLED_LOCAL\',resolved_at=CURRENT_TIMESTAMP "\n'
              '                        "WHERE state=\'RESERVED\'"',
              '"UPDATE dispatch_attempts SET state=\'CANCELLED_LOCAL\',"\n'
              '                        "resolved_at=CURRENT_TIMESTAMP "\n'
              '                        "WHERE state=\'RESERVED\'"',
          )
          text = text.replace(
              '"UPDATE work_items SET status=\'CANCELLED_LOCAL\',updated_at=CURRENT_TIMESTAMP "\n'
              '                            "WHERE dispatch_key=?"',
              '"UPDATE work_items SET status=\'CANCELLED_LOCAL\',"\n'
              '                            "updated_at=CURRENT_TIMESTAMP "\n'
              '                            "WHERE dispatch_key=?"',
          )
          text = text.replace(
              '"INSERT INTO work_items(dispatch_key,fingerprint,attempt_id,status) VALUES(?,?,?,?)"',
              '"INSERT INTO work_items(dispatch_key,fingerprint,"\n'
              '                "attempt_id,status) VALUES(?,?,?,?)"',
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff check --fix .
          ruff format .
      - name: Commit lint fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'style: satisfy repository lint policy'
          git push origin HEAD:${{ github.ref_name }}
