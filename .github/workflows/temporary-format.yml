name: Temporary format branch

on:
  push:
    branches: [chore/repo-quality-ratchet]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'ruff>=0.9,<1'
      - run: ruff format .
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'style: format Python sources'
          git push origin HEAD:${{ github.ref_name }}
