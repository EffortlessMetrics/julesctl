name: Temporary PR31 baseline alignment

on:
  push:
    branches: [fix/exact-prune-redacted-results]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,security]'
      - name: Add explicit plan-time baselines to non-legacy tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'selector={"nonterminal": True, "include_unknown": False},':
                  'selector={"nonterminal": True, "include_unknown": False, "baseline_session_ids": ["1"]},',
              'selector={"nonterminal": True},':
                  'selector={"nonterminal": True, "baseline_session_ids": ["1"]},',
              'selector={"all_sessions": True},':
                  'selector={"all_sessions": True, "baseline_session_ids": ["1"]},',
          }
          for filename in (
              "tests/test_prune.py",
              "tests/test_prune_receipts.py",
              "tests/test_prune_review_findings.py",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          ruff format .
          ruff check .
          mypy
          pytest --cov=julesctl --cov-branch --cov-fail-under=65
          bandit -r src/julesctl -c pyproject.toml
          python -m pip_audit
      - name: Commit verified alignment
        shell: bash
        run: |
          git rm .github/workflows/temporary-pr31-baselines.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'test(prune): distinguish complete and legacy plans'
          git push origin HEAD:${{ github.ref_name }}
