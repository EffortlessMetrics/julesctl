name: Temporary phase 19 patch

on:
  push:
    branches: [feat/session-artifacts-results]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Apply and verify phase 19
        shell: bash
        run: |
          tr '_-' '/+' < .github/phase19.url.b64 | base64 -d | gzip -d > /tmp/phase19.patch
          git apply --3way /tmp/phase19.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/application/artifacts.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''        if output.pull_request is not None:
              item = _pull_request(output.pull_request)
              identity = str(item.get("url") or item)
              if identity not in seen_prs:
                  seen_prs.add(identity)
                  pull_requests.append(item)
          ''',
              '''        if output.pull_request is not None:
              pr_item = _pull_request(output.pull_request)
              pr_identity = str(pr_item.get("url") or pr_item)
              if pr_identity not in seen_prs:
                  seen_prs.add(pr_identity)
                  pull_requests.append(pr_item)
          ''',
          )
          text = text.replace(
              '''        if output.change_set is not None:
              item = _change_set(output.change_set, surface="session_output")
              if item is not None:
                  identity = (
                      item.get("source"),
                      item.get("base_commit_id"),
                      item.get("unidiff_patch"),
                  )
                  if identity not in seen_patches:
                      seen_patches.add(identity)
                      patches.append(item)
          ''',
              '''        if output.change_set is not None:
              patch_item = _change_set(output.change_set, surface="session_output")
              if patch_item is not None:
                  patch_identity = (
                      patch_item.get("source"),
                      patch_item.get("base_commit_id"),
                      patch_item.get("unidiff_patch"),
                  )
                  if patch_identity not in seen_patches:
                      seen_patches.add(patch_identity)
                      patches.append(patch_item)
          ''',
          )
          text = text.replace(
              '''            if artifact.change_set is not None:
                  item = _change_set(
                      artifact.change_set,
                      surface="activity",
                      activity_name=activity.name,
                  )
                  if item is not None:
                      identity = (
                          item.get("source"),
                          item.get("base_commit_id"),
                          item.get("unidiff_patch"),
                      )
                      if identity not in seen_patches:
                          seen_patches.add(identity)
                          patches.append(item)
          ''',
              '''            if artifact.change_set is not None:
                  activity_patch_item = _change_set(
                      artifact.change_set,
                      surface="activity",
                      activity_name=activity.name,
                  )
                  if activity_patch_item is not None:
                      activity_patch_identity = (
                          activity_patch_item.get("source"),
                          activity_patch_item.get("base_commit_id"),
                          activity_patch_item.get("unidiff_patch"),
                      )
                      if activity_patch_identity not in seen_patches:
                          seen_patches.add(activity_patch_identity)
                          patches.append(activity_patch_item)
          ''',
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/phase19.url.b64 .github/workflows/temporary-phase19.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat: add result, patch, and PR artifact commands'
          git push origin HEAD:${{ github.ref_name }}
