name: Temporary phase 19 patch

on:
  push:
    branches: [feat/session-artifacts-results]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Apply and verify phase 19
        shell: bash
        run: |
          tr '_-' '/+' < .github/phase19.url.b64 | base64 -d | gzip -d > /tmp/phase19.patch
          git apply --3way /tmp/phase19.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/application/artifacts.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '            item = _pull_request(output.pull_request)\n':
                  '            pr_item = _pull_request(output.pull_request)\n',
              '            identity = str(item.get("url") or item)\n':
                  '            pr_identity = str(pr_item.get("url") or pr_item)\n',
              '            if identity not in seen_prs:\n':
                  '            if pr_identity not in seen_prs:\n',
              '                seen_prs.add(identity)\n':
                  '                seen_prs.add(pr_identity)\n',
              '                pull_requests.append(item)\n':
                  '                pull_requests.append(pr_item)\n',
              '            item = _change_set(output.change_set, surface="session_output")\n':
                  '            patch_item = _change_set(output.change_set, surface="session_output")\n',
              '            if item is not None:\n':
                  '            if patch_item is not None:\n',
              '                    item.get("source"),\n':
                  '                    patch_item.get("source"),\n',
              '                    item.get("base_commit_id"),\n':
                  '                    patch_item.get("base_commit_id"),\n',
              '                    item.get("unidiff_patch"),\n':
                  '                    patch_item.get("unidiff_patch"),\n',
              '                if identity not in seen_patches:\n':
                  '                if patch_identity not in seen_patches:\n',
              '                    seen_patches.add(identity)\n':
                  '                    seen_patches.add(patch_identity)\n',
              '                    patches.append(item)\n':
                  '                    patches.append(patch_item)\n',
              '                item = _change_set(\n':
                  '                activity_patch_item = _change_set(\n',
              '                if item is not None:\n':
                  '                if activity_patch_item is not None:\n',
              '                        item.get("source"),\n':
                  '                        activity_patch_item.get("source"),\n',
              '                        item.get("base_commit_id"),\n':
                  '                        activity_patch_item.get("base_commit_id"),\n',
              '                        item.get("unidiff_patch"),\n':
                  '                        activity_patch_item.get("unidiff_patch"),\n',
              '                    if identity not in seen_patches:\n':
                  '                    if activity_patch_identity not in seen_patches:\n',
              '                        seen_patches.add(identity)\n':
                  '                        seen_patches.add(activity_patch_identity)\n',
              '                        patches.append(item)\n':
                  '                        patches.append(activity_patch_item)\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"artifact typing marker not found: {old!r}")
              text = text.replace(old, new, 1)
          text = text.replace(
              '                identity = (\n',
              '                patch_identity = (\n',
              1,
          )
          text = text.replace(
              '                    identity = (\n',
              '                    activity_patch_identity = (\n',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/phase19.url.b64 .github/workflows/temporary-phase19.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat: add result, patch, and PR artifact commands'
          git push origin HEAD:${{ github.ref_name }}
