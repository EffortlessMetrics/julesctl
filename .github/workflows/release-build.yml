name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'build>=1.2,<2' 'twine>=5,<7'
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv /tmp/julesctl-release
          /tmp/julesctl-release/bin/python -m pip install dist/*.whl
          /tmp/julesctl-release/bin/julesctl --help
      - name: Write checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: julesctl-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
