name: Temporary Jules read-only canary

on:
  push:
    branches: [test/live-readonly-canary]

concurrency:
  group: jules-readonly-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: jules-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Run read-only Jules acceptance probe
        env:
          JULES_LIVE_TEST: "1"
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_LIVE_TASK_BUDGET: "0"
        run: pytest -m live -k live_read_only_contract -vv
