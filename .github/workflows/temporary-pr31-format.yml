name: Temporary PR31 formatter

on:
  push:
    branches: [fix/exact-prune-redacted-results]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,security]'
      - run: ruff format .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov=julesctl --cov-branch --cov-fail-under=65
      - run: bandit -r src/julesctl -c pyproject.toml
      - run: python -m pip_audit
      - name: Commit formatted verified branch
        shell: bash
        run: |
          git rm .github/workflows/temporary-pr31-format.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'style: format exact prune and redaction fixes'
          git push origin HEAD:${{ github.ref_name }}
