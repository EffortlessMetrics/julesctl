name: Temporary REST finish

on:
  push:
    branches: [fix/rest-contract-retry-policy]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Remove undocumented session filtering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/controller.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          filtered: list[str] = []
          changed = False
          for line in lines:
              if 'filter_value = "archived = true OR archived = false"' in line:
                  changed = True
                  continue
              if "self.ctx.api.iter_sessions(filter_value=filter_value)" in line:
                  filtered.append(line.replace(
                      "self.ctx.api.iter_sessions(filter_value=filter_value)",
                      "self.ctx.api.iter_sessions()",
                  ))
                  changed = True
                  continue
              filtered.append(line)
          if not changed:
              raise SystemExit("controller session-list contract was not changed")
          path.write_text("".join(filtered), encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit verified controller change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add src/julesctl/controller.py tests
          git commit -m 'fix(api): keep session filtering client-side'
          git push origin HEAD:${{ github.ref_name }}
