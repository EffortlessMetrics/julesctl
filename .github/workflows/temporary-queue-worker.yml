name: Temporary queue worker patch

on:
  push:
    branches: [feat/credential-isolated-queue]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Register queue and worker commands
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/cli/app.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from .queue import queue_app, worker_app\n"
          output_import = (
              "from .output import console, emit_json, emit_jsonl, err_console, event, operation\n"
          )
          if import_line not in text:
              text = text.replace(output_import, output_import + import_line, 1)
          registrations = (
              'app.add_typer(queue_app, name="queue")\n'
              'app.add_typer(worker_app, name="worker")\n'
          )
          state_registration = 'app.add_typer(state_app, name="state")\n'
          if registrations not in text:
              text = text.replace(
                  state_registration,
                  state_registration + registrations,
                  1,
              )
          path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q src/julesctl
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit queue worker implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat(queue): isolate unprivileged submission from Jules credentials'
          git push origin HEAD:${{ github.ref_name }}
