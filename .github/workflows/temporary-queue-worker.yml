name: Temporary queue worker patch

on:
  push:
    branches: [feat/credential-isolated-queue]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Wire candidate queue and worker CLI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          store_path = Path("src/julesctl/store.py")
          store = store_path.read_text(encoding="utf-8")
          store = store.replace("_SCHEMA_VERSION = 1", "_SCHEMA_VERSION = 2", 1)

          schema_marker = "CREATE TABLE IF NOT EXISTS deletion_plans ("
          queue_schema = "\n".join(
              [
                  "CREATE TABLE IF NOT EXISTS candidate_queue (",
                  "    candidate_id TEXT PRIMARY KEY,",
                  "    dispatch_key TEXT NOT NULL UNIQUE,",
                  "    spec_json TEXT NOT NULL,",
                  "    state TEXT NOT NULL,",
                  "    worker_id TEXT,",
                  "    created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,",
                  "    claimed_at TEXT,",
                  "    completed_at TEXT,",
                  "    outcome_json TEXT,",
                  "    error_json TEXT,",
                  "    attempts INTEGER NOT NULL DEFAULT 0",
                  ");",
                  "",
              ]
          )
          if "CREATE TABLE IF NOT EXISTS candidate_queue" not in store:
              if schema_marker not in store:
                  raise SystemExit("deletion plan schema marker not found")
              store = store.replace(schema_marker, queue_schema + schema_marker, 1)
              store = store.replace(
                  "CREATE INDEX IF NOT EXISTS idx_sessions_lifecycle",
                  "CREATE INDEX IF NOT EXISTS idx_candidate_queue_state "
                  "ON candidate_queue(state, created_at);\n"
                  "CREATE INDEX IF NOT EXISTS idx_sessions_lifecycle",
                  1,
              )

          method_marker = "    def active_rows(self) -> list[sqlite3.Row]:\n"
          queue_methods = "\n".join(
              [
                  "    def enqueue_candidate(",
                  "        self,",
                  "        *,",
                  "        candidate_id: str,",
                  "        dispatch_key: str,",
                  "        spec_json: str,",
                  "    ) -> dict[str, object]:",
                  "        with self.immediate() as conn:",
                  "            existing = conn.execute(",
                  "                \"SELECT * FROM candidate_queue WHERE dispatch_key=?\",",
                  "                (dispatch_key,),",
                  "            ).fetchone()",
                  "            if existing is not None:",
                  "                if str(existing[\"spec_json\"]) != spec_json:",
                  "                    raise InputError(",
                  "                        \"dispatch_key is already queued with a different candidate\"",
                  "                    )",
                  "                return {",
                  "                    \"outcome\": \"existing\",",
                  "                    \"candidate_id\": existing[\"candidate_id\"],",
                  "                    \"dispatch_key\": dispatch_key,",
                  "                    \"state\": existing[\"state\"],",
                  "                }",
                  "            conn.execute(",
                  "                \"\"\"INSERT INTO candidate_queue(",
                  "                    candidate_id,dispatch_key,spec_json,state",
                  "                ) VALUES(?,?,?,\"PENDING\")\"\"\",",
                  "                (candidate_id, dispatch_key, spec_json),",
                  "            )",
                  "            return {",
                  "                \"outcome\": \"queued\",",
                  "                \"candidate_id\": candidate_id,",
                  "                \"dispatch_key\": dispatch_key,",
                  "                \"state\": \"PENDING\",",
                  "            }",
                  "",
                  "    def list_candidates(self, *, limit: int = 100) -> list[dict[str, object]]:",
                  "        if not 1 <= limit <= 1000:",
                  "            raise InputError(\"candidate list limit must be between 1 and 1000\")",
                  "        rows = self._conn.execute(",
                  "            \"SELECT * FROM candidate_queue ORDER BY created_at,candidate_id LIMIT ?\",",
                  "            (limit,),",
                  "        )",
                  "        items: list[dict[str, object]] = []",
                  "        for row in rows:",
                  "            item = dict(row)",
                  "            for field in (\"outcome_json\", \"error_json\"):",
                  "                raw = item.pop(field, None)",
                  "                if raw is not None:",
                  "                    item[field.removesuffix(\"_json\")] = json.loads(str(raw))",
                  "            item.pop(\"spec_json\", None)",
                  "            items.append(item)",
                  "        return items",
                  "",
                  "    def candidate_counts(self) -> dict[str, int]:",
                  "        return {",
                  "            str(row[\"state\"]): int(row[\"n\"])",
                  "            for row in self._conn.execute(",
                  "                \"SELECT state,COUNT(*) AS n FROM candidate_queue GROUP BY state\"",
                  "            )",
                  "        }",
                  "",
                  "    def requeue_stale_candidates(self, *, older_than_seconds: int) -> int:",
                  "        if older_than_seconds < 1:",
                  "            raise InputError(\"stale claim age must be positive\")",
                  "        modifier = f\"-{older_than_seconds} seconds\"",
                  "        with self.immediate() as conn:",
                  "            cur = conn.execute(",
                  "                \"\"\"UPDATE candidate_queue SET",
                  "                    state='PENDING',worker_id=NULL,claimed_at=NULL",
                  "                WHERE state='CLAIMED'",
                  "                  AND claimed_at < datetime('now',?)\"\"\",",
                  "                (modifier,),",
                  "            )",
                  "            return int(cur.rowcount)",
                  "",
                  "    def claim_candidates(",
                  "        self,",
                  "        *,",
                  "        limit: int,",
                  "        worker_id: str,",
                  "    ) -> list[sqlite3.Row]:",
                  "        if not 1 <= limit <= 100:",
                  "            raise InputError(\"claim limit must be between 1 and 100\")",
                  "        with self.immediate() as conn:",
                  "            if self._meta_value(conn, \"fleet_frozen\", \"0\") == \"1\":",
                  "                raise AdmissionError(\"fleet admission is frozen\")",
                  "            rows = list(",
                  "                conn.execute(",
                  "                    \"\"\"SELECT * FROM candidate_queue",
                  "                    WHERE state='PENDING'",
                  "                    ORDER BY created_at,candidate_id",
                  "                    LIMIT ?\"\"\",",
                  "                    (limit,),",
                  "                )",
                  "            )",
                  "            claimed: list[sqlite3.Row] = []",
                  "            for row in rows:",
                  "                cur = conn.execute(",
                  "                    \"\"\"UPDATE candidate_queue SET",
                  "                        state='CLAIMED',worker_id=?,claimed_at=CURRENT_TIMESTAMP,",
                  "                        attempts=attempts+1",
                  "                    WHERE candidate_id=? AND state='PENDING'\"\"\",",
                  "                    (worker_id, row[\"candidate_id\"]),",
                  "                )",
                  "                if cur.rowcount == 1:",
                  "                    refreshed = conn.execute(",
                  "                        \"SELECT * FROM candidate_queue WHERE candidate_id=?\",",
                  "                        (row[\"candidate_id\"],),",
                  "                    ).fetchone()",
                  "                    if refreshed is not None:",
                  "                        claimed.append(refreshed)",
                  "            return claimed",
                  "",
                  "    def release_candidate(self, candidate_id: str) -> None:",
                  "        with self.immediate() as conn:",
                  "            cur = conn.execute(",
                  "                \"\"\"UPDATE candidate_queue SET",
                  "                    state='PENDING',worker_id=NULL,claimed_at=NULL",
                  "                WHERE candidate_id=? AND state='CLAIMED'\"\"\",",
                  "                (candidate_id,),",
                  "            )",
                  "            if cur.rowcount != 1:",
                  "                raise InputError(f\"candidate {candidate_id} is not claimed\")",
                  "",
                  "    def finish_candidate(",
                  "        self,",
                  "        candidate_id: str,",
                  "        *,",
                  "        state: str,",
                  "        outcome: dict[str, object] | None = None,",
                  "        error: dict[str, object] | None = None,",
                  "    ) -> None:",
                  "        with self.immediate() as conn:",
                  "            cur = conn.execute(",
                  "                \"\"\"UPDATE candidate_queue SET",
                  "                    state=?,completed_at=CURRENT_TIMESTAMP,",
                  "                    outcome_json=?,error_json=?",
                  "                WHERE candidate_id=? AND state='CLAIMED'\"\"\",",
                  "                (",
                  "                    state,",
                  "                    json.dumps(outcome, sort_keys=True) if outcome is not None else None,",
                  "                    json.dumps(error, sort_keys=True) if error is not None else None,",
                  "                    candidate_id,",
                  "                ),",
                  "            )",
                  "            if cur.rowcount != 1:",
                  "                raise InputError(f\"candidate {candidate_id} is not claimed\")",
                  "",
                  "",
              ]
          )
          if "def enqueue_candidate" not in store:
              if method_marker not in store:
                  raise SystemExit("active_rows method marker not found")
              store = store.replace(method_marker, queue_methods + method_marker, 1)
          store_path.write_text(store, encoding="utf-8")

          app_path = Path("src/julesctl/cli/app.py")
          app = app_path.read_text(encoding="utf-8")
          queue_import = (
              "from ..application.queue import (\n"
              "    enqueue_candidate,\n"
              "    load_candidate,\n"
              "    queue_status,\n"
              "    run_worker_once,\n"
              ")\n"
          )
          steering_import = (
              "from ..application.steering import approve_once, archive_once, message_once, unarchive_once\n"
          )
          if queue_import not in app:
              app = app.replace(steering_import, queue_import + steering_import, 1)
          if "queue_app = typer.Typer" not in app:
              app = app.replace(
                  "state_app = typer.Typer(help=\"Local controller state\")\n",
                  "state_app = typer.Typer(help=\"Local controller state\")\n"
                  "queue_app = typer.Typer(help=\"Unprivileged candidate queue\")\n"
                  "worker_app = typer.Typer(help=\"Credentialed queue worker\")\n",
                  1,
              )
              app = app.replace(
                  "app.add_typer(state_app, name=\"state\")\n",
                  "app.add_typer(state_app, name=\"state\")\n"
                  "app.add_typer(queue_app, name=\"queue\")\n"
                  "app.add_typer(worker_app, name=\"worker\")\n",
                  1,
              )

          commands = "\n".join(
              [
                  "",
                  "@app.command(\"submit\")",
                  "def submit_candidate(",
                  "    spec: Annotated[Path, typer.Option(\"--spec\", exists=True, dir_okay=False)],",
                  "    json_output: Annotated[bool, typer.Option(\"--json\")] = False,",
                  ") -> None:",
                  "    try:",
                  "        candidate = load_candidate(spec)",
                  "        selected_profile = profile_name()",
                  "        store = StateStore(",
                  "            default_database_path(selected_profile),",
                  "            profile_name=selected_profile,",
                  "        )",
                  "        try:",
                  "            result = enqueue_candidate(store, candidate)",
                  "        finally:",
                  "            store.close()",
                  "        if json_output:",
                  "            emit_json(operation(\"submit\", str(result[\"outcome\"]), result))",
                  "        else:",
                  "            console.print(result)",
                  "    except (JulesCtlError, ValueError) as exc:",
                  "        _error(\"submit\", exc, machine=json_output)",
                  "",
                  "",
                  "@queue_app.command(\"status\")",
                  "def candidate_queue_status(",
                  "    limit: Annotated[int, typer.Option(\"--limit\", min=1, max=1000)] = 100,",
                  "    json_output: Annotated[bool, typer.Option(\"--json\")] = False,",
                  ") -> None:",
                  "    try:",
                  "        selected_profile = profile_name()",
                  "        store = StateStore(",
                  "            default_database_path(selected_profile),",
                  "            profile_name=selected_profile,",
                  "        )",
                  "        try:",
                  "            result = queue_status(store, limit=limit)",
                  "        finally:",
                  "            store.close()",
                  "        if json_output:",
                  "            emit_json(operation(\"queue.status\", \"completed\", result))",
                  "        else:",
                  "            console.print(result)",
                  "    except (JulesCtlError, ValueError) as exc:",
                  "        _error(\"queue.status\", exc, machine=json_output)",
                  "",
                  "",
                  "@worker_app.command(\"run-once\")",
                  "def worker_run_once(",
                  "    max_items: Annotated[int, typer.Option(\"--max\", min=1, max=100)] = 5,",
                  "    allow_repo: Annotated[list[str] | None, typer.Option(\"--allow-repo\")] = None,",
                  "    allow_repoless: Annotated[bool, typer.Option(\"--allow-repoless\")] = False,",
                  "    json_output: Annotated[bool, typer.Option(\"--json\")] = False,",
                  "    jsonl: Annotated[bool, typer.Option(\"--jsonl\")] = False,",
                  ") -> None:",
                  "    try:",
                  "        if json_output and jsonl:",
                  "            raise InputError(\"--json and --jsonl are mutually exclusive\")",
                  "        outcomes = run_worker_once(",
                  "            Settings.from_env(),",
                  "            max_items=max_items,",
                  "            allow_repos=allow_repo or [],",
                  "            allow_repoless=allow_repoless,",
                  "        )",
                  "        if jsonl:",
                  "            emit_jsonl(",
                  "                [",
                  "                    {\"schema\": \"julesctl.worker-result.v1\", **item}",
                  "                    for item in outcomes",
                  "                ]",
                  "            )",
                  "        elif json_output:",
                  "            emit_json(operation(\"worker.run-once\", \"completed\", {\"items\": outcomes}))",
                  "        else:",
                  "            console.print(outcomes)",
                  "    except (JulesCtlError, ValueError) as exc:",
                  "        _error(\"worker.run-once\", exc, machine=json_output or jsonl)",
                  "",
                  "",
              ]
          )
          marker = "@fleet_app.command(\"status\")\n"
          if "def submit_candidate(" not in app:
              if marker not in app:
                  raise SystemExit("fleet status marker not found")
              app = app.replace(marker, commands + marker, 1)
          app_path.write_text(app, encoding="utf-8")
          PY
          python -m compileall -q src/julesctl
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit queue worker implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat(queue): isolate unprivileged submission from Jules credentials'
          git push origin HEAD:${{ github.ref_name }}
