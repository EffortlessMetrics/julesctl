name: Temporary phase 20 patch

on:
  push:
    branches: [feat/fleet-prune-retry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Apply and verify phase 20
        shell: bash
        run: |
          tr '_-' '/+' < .github/phase20.url.b64 | base64 -d | gzip -d > /tmp/phase20.patch
          git apply --3way /tmp/phase20.patch
          python - <<'PY'
          from pathlib import Path

          prune = Path("src/julesctl/application/prune.py")
          text = prune.read_text(encoding="utf-8")
          helper = '''\n\ndef _selector_states(selector: dict[str, object]) -> list[str] | None:\n    raw = selector.get("states")\n    if raw is None:\n        return None\n    if not isinstance(raw, list) or not all(isinstance(item, str) for item in raw):\n        raise InputError("stored deletion selector has invalid states")\n    return list(raw) or None\n'''
          marker = "\ndef apply_plan_with_settle(\n"
          if helper not in text:
              if marker not in text:
                  raise SystemExit("apply_plan_with_settle marker not found")
              text = text.replace(marker, helper + marker, 1)
          old = 'states=list(selector.get("states") or []) or None,'
          if old not in text:
              raise SystemExit("prune selector state expression not found")
          text = text.replace(old, 'states=_selector_states(selector),', 1)
          prune.write_text(text, encoding="utf-8")

          client = Path("src/julesctl/client.py")
          text = client.read_text(encoding="utf-8")
          old = '        targets = [{"session_id": value.removeprefix("sessions/")} for value in session_ids]\n'
          new = '''        targets: list[dict[str, object]] = [\n            {"session_id": value.removeprefix("sessions/")} for value in session_ids\n        ]\n'''
          if old not in text:
              raise SystemExit("remove-session target typing marker not found")
          client.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/phase20.url.b64 .github/workflows/temporary-phase20.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat: add exact fleet prune and explicit retry'
          git push origin HEAD:${{ github.ref_name }}
