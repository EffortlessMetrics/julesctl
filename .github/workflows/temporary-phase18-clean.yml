name: Temporary phase 18 clean patch

on:
  push:
    branches: [feat/session-observe-steer]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Apply and verify phase 18
        shell: bash
        run: |
          tr '_-' '/+' < .github/phase18.url.b64 | base64 -d | gzip -d > /tmp/phase18.patch
          git apply --3way /tmp/phase18.patch
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/phase18.url.b64 .github/workflows/temporary-phase18-clean.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat: add fleet filters and durable watch commands'
          git push origin HEAD:${{ github.ref_name }}
