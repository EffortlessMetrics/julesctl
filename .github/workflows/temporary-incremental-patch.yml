name: Temporary incremental reconciliation patch

on:
  push:
    branches: [feat/incremental-activity-reconcile]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Wire durable activity cursors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          store_path = Path("src/julesctl/store.py")
          store = store_path.read_text(encoding="utf-8")
          schema_marker = "CREATE TABLE IF NOT EXISTS deletion_plans ("
          cursor_schema = """CREATE TABLE IF NOT EXISTS activity_cursors (
              session_id TEXT PRIMARY KEY,
              highest_create_time TEXT,
              updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          """
          if "CREATE TABLE IF NOT EXISTS activity_cursors" not in store:
              if schema_marker not in store:
                  raise SystemExit("deletion plan schema marker not found")
              store = store.replace(schema_marker, cursor_schema + schema_marker, 1)

          method_marker = "    def active_rows(self) -> list[sqlite3.Row]:\n"
          cursor_methods = '''    def activity_cursor(self, session_id: str) -> str | None:
              row = self._conn.execute(
                  "SELECT highest_create_time FROM activity_cursors WHERE session_id=?",
                  (session_id,),
              ).fetchone()
              if row is None or row["highest_create_time"] is None:
                  return None
              return str(row["highest_create_time"])

          def commit_activity_batch(
              self,
              *,
              session_id: str,
              receipts: list[dict[str, str | None]],
              highest_create_time: str | None,
          ) -> set[str]:
              new_names: set[str] = set()
              with self.immediate() as conn:
                  for receipt in receipts:
                      activity_name = str(receipt["activity_name"])
                      cur = conn.execute(
                          """INSERT OR IGNORE INTO activity_receipts(
                              session_id,activity_name,activity_id,create_time,event_type,
                              payload_sha256
                          ) VALUES(?,?,?,?,?,?)""",
                          (
                              session_id,
                              activity_name,
                              receipt.get("activity_id"),
                              receipt.get("create_time"),
                              receipt["event_type"],
                              receipt["payload_sha256"],
                          ),
                      )
                      if cur.rowcount == 1:
                          new_names.add(activity_name)
                  if highest_create_time is not None:
                      conn.execute(
                          """INSERT INTO activity_cursors(
                              session_id,highest_create_time
                          ) VALUES(?,?)
                          ON CONFLICT(session_id) DO UPDATE SET
                              highest_create_time=excluded.highest_create_time,
                              updated_at=CURRENT_TIMESTAMP
                          """,
                          (session_id, highest_create_time),
                      )
              return new_names

          '''
          if "def activity_cursor" not in store:
              if method_marker not in store:
                  raise SystemExit("active_rows method marker not found")
              store = store.replace(method_marker, cursor_methods + method_marker, 1)
          store_path.write_text(store, encoding="utf-8")

          controller_path = Path("src/julesctl/controller.py")
          lines = controller_path.read_text(encoding="utf-8").splitlines(keepends=True)
          import_line = "from .application.reconcile import reconcile_session_activities\n"
          if import_line not in lines:
              api_import = "from .api.client import JulesApiClient\n"
              try:
                  index = lines.index(api_import)
              except ValueError as exc:
                  raise SystemExit("JulesApiClient import marker not found") from exc
              lines.insert(index + 1, import_line)

          try:
              start = next(i for i, line in enumerate(lines) if line.startswith("    def reconcile(self)"))
              end = next(
                  i
                  for i, line in enumerate(lines[start + 1 :], start + 1)
                  if line.startswith("    def session_result(")
              )
          except StopIteration as exc:
              raise SystemExit("controller reconcile/session_result markers not found") from exc

          replacement = '''    def reconcile(self) -> list[dict[str, object]]:
              events: list[dict[str, object]] = []
              managed = self.ctx.store.managed_session_ids()
              sessions = list(self.ctx.api.iter_sessions())
              self.ctx.store.reconcile_active_snapshot({session.id for session in sessions})
              for session in sessions:
                  origin = "managed" if session.id in managed else "external"
                  self._remember_session(session, origin=origin)
                  events.extend(
                      reconcile_session_activities(
                          self.ctx.api,
                          self.ctx.store,
                          session.id,
                          origin=origin,
                      )
                  )
              return events

          '''.splitlines(keepends=True)
          lines[start:end] = replacement
          controller_path.write_text("".join(lines), encoding="utf-8")
          PY
          python -m compileall -q src/julesctl
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit reconciliation implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat(reconcile): persist incremental activity cursors'
          git push origin HEAD:${{ github.ref_name }}
