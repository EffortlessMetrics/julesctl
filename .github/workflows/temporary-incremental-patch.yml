name: Temporary incremental reconciliation patch

on:
  push:
    branches: [feat/incremental-activity-reconcile]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Wire durable activity cursors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          store_path = Path("src/julesctl/store.py")
          store = store_path.read_text(encoding="utf-8")
          cursor_schema = """CREATE TABLE IF NOT EXISTS activity_cursors (
              session_id TEXT PRIMARY KEY,
              highest_create_time TEXT,
              updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          """
          marker = "CREATE TABLE IF NOT EXISTS deletion_plans ("
          if "CREATE TABLE IF NOT EXISTS activity_cursors" not in store:
              store = store.replace(marker, cursor_schema + marker, 1)

          methods = '''    def activity_cursor(self, session_id: str) -> str | None:
              row = self._conn.execute(
                  "SELECT highest_create_time FROM activity_cursors WHERE session_id=?",
                  (session_id,),
              ).fetchone()
              if row is None or row["highest_create_time"] is None:
                  return None
              return str(row["highest_create_time"])

              def commit_activity_batch(
                  self,
                  *,
                  session_id: str,
                  receipts: list[dict[str, str | None]],
                  highest_create_time: str | None,
              ) -> set[str]:
                  new_names: set[str] = set()
                  with self.immediate() as conn:
                      for receipt in receipts:
                          activity_name = str(receipt["activity_name"])
                          cur = conn.execute(
                              """INSERT OR IGNORE INTO activity_receipts(
                                  session_id,activity_name,activity_id,create_time,event_type,
                                  payload_sha256
                              ) VALUES(?,?,?,?,?,?)""",
                              (
                                  session_id,
                                  activity_name,
                                  receipt.get("activity_id"),
                                  receipt.get("create_time"),
                                  receipt["event_type"],
                                  receipt["payload_sha256"],
                              ),
                          )
                          if cur.rowcount == 1:
                              new_names.add(activity_name)
                      if highest_create_time is not None:
                          conn.execute(
                              """INSERT INTO activity_cursors(
                                  session_id,highest_create_time
                              ) VALUES(?,?)
                              ON CONFLICT(session_id) DO UPDATE SET
                                  highest_create_time=excluded.highest_create_time,
                                  updated_at=CURRENT_TIMESTAMP
                              """,
                              (session_id, highest_create_time),
                          )
                  return new_names

          '''
          methods = methods.replace("              def commit_activity_batch", "    def commit_activity_batch")
          methods = methods.replace("                  self,", "        self,")
          methods = methods.replace("                  *,", "        *,")
          methods = methods.replace("                  session_id:", "        session_id:")
          methods = methods.replace("                  receipts:", "        receipts:")
          methods = methods.replace("                  highest_create_time:", "        highest_create_time:")
          methods = methods.replace("              ) -> set[str]:", "    ) -> set[str]:")
          methods = methods.replace("                  new_names", "        new_names")
          methods = methods.replace("                  with self.immediate()", "        with self.immediate()")
          methods = methods.replace("                      for receipt", "            for receipt")
          methods = methods.replace("                          activity_name", "                activity_name")
          methods = methods.replace("                          cur =", "                cur =")
          methods = methods.replace("                              \"\"\"INSERT", "                    \"\"\"INSERT")
          methods = methods.replace("                                  session_id", "                        session_id")
          methods = methods.replace("                                  payload_sha256", "                        payload_sha256")
          methods = methods.replace("                              ) VALUES", "                    ) VALUES")
          methods = methods.replace("                              (", "                    (")
          methods = methods.replace("                                  activity_name", "                        activity_name")
          methods = methods.replace("                                  receipt", "                        receipt")
          methods = methods.replace("                              ),", "                    ),")
          methods = methods.replace("                          )", "                )")
          methods = methods.replace("                          if cur", "                if cur")
          methods = methods.replace("                              new_names", "                    new_names")
          methods = methods.replace("                      if highest", "            if highest")
          methods = methods.replace("                          conn.execute", "                conn.execute")
          methods = methods.replace("                              \"\"\"INSERT INTO", "                    \"\"\"INSERT INTO")
          methods = methods.replace("                                  session_id,highest", "                        session_id,highest")
          methods = methods.replace("                              ) VALUES", "                    ) VALUES")
          methods = methods.replace("                                  highest_create_time", "                        highest_create_time")
          methods = methods.replace("                                  updated_at", "                        updated_at")
          methods = methods.replace("                              \"\"\",", "                    \"\"\",")
          methods = methods.replace("                              (session_id", "                    (session_id")
          methods = methods.replace("                          )", "                )")
          methods = methods.replace("                  return new_names", "        return new_names")
          if "def activity_cursor" not in store:
              store = store.replace("    def active_rows", methods + "    def active_rows", 1)
          store_path.write_text(store, encoding="utf-8")

          controller_path = Path("src/julesctl/controller.py")
          controller = controller_path.read_text(encoding="utf-8")
          import_marker = "from .api.client import JulesApiClient\n"
          reconcile_import = (
              import_marker
              + "from .application.reconcile import reconcile_session_activities\n"
          )
          if "reconcile_session_activities" not in controller:
              controller = controller.replace(import_marker, reconcile_import, 1)
          replacement = '''    def reconcile(self) -> list[dict[str, object]]:
              events: list[dict[str, object]] = []
              managed = self.ctx.store.managed_session_ids()
              sessions = list(self.ctx.api.iter_sessions())
              self.ctx.store.reconcile_active_snapshot({session.id for session in sessions})
              for session in sessions:
                  origin = "managed" if session.id in managed else "external"
                  self._remember_session(session, origin=origin)
                  events.extend(
                      reconcile_session_activities(
                          self.ctx.api,
                          self.ctx.store,
                          session.id,
                          origin=origin,
                      )
                  )
              return events

              def session_result'''
          replacement = replacement.replace("              def session_result", "    def session_result")
          controller, count = re.subn(
              r"    def reconcile\(self\).*?\n    def session_result",
              replacement,
              controller,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected one reconcile block, replaced {count}")
          controller_path.write_text(controller, encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit reconciliation implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'feat(reconcile): persist incremental activity cursors'
          git push origin HEAD:${{ github.ref_name }}
