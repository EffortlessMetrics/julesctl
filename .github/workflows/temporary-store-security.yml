name: Temporary store security fix

on:
  push:
    branches: [chore/release-security-lock]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,security]'
      - name: Replace dynamic SQL construction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/store.py")
          text = path.read_text(encoding="utf-8")

          old = "_ROLLING_24H_CUTOFF_SQL = \"strftime('%Y-%m-%dT%H:%M:%SZ','now','-24 hours')\"\n"
          new = (
              "_ROLLING_24H_COUNT_SQL = (\n"
              "    \"SELECT COUNT(*) AS n FROM dispatch_attempts \"\n"
              "    \"WHERE send_started_at >= strftime('%Y-%m-%dT%H:%M:%SZ','now','-24 hours')\"\n"
              ")\n"
              "_UNRESOLVED_ATTEMPT_COUNT_SQL = (\n"
              "    \"SELECT COUNT(*) AS n FROM dispatch_attempts \"\n"
              "    \"WHERE state IN (?,?,?,?,?)\"\n"
              ")\n"
          )
          if old not in text:
              raise SystemExit("rolling cutoff constant not found")
          text = text.replace(old, new, 1)

          old = '''        row = self._conn.execute(
              "SELECT COUNT(*) AS n FROM dispatch_attempts "
              f"WHERE send_started_at >= {_ROLLING_24H_CUTOFF_SQL}"
          ).fetchone()
          '''
          new = '''        row = self._conn.execute(_ROLLING_24H_COUNT_SQL).fetchone()
          '''
          if text.count(old) != 1:
              raise SystemExit(f"starts_last_24h block count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        marks = ",".join("?" for _ in _UNRESOLVED_ATTEMPT_STATES)
              row = self._conn.execute(
                  f"SELECT COUNT(*) AS n FROM dispatch_attempts WHERE state IN ({marks})",
                  _UNRESOLVED_ATTEMPT_STATES,
              ).fetchone()
          '''
          new = '''        row = self._conn.execute(
              _UNRESOLVED_ATTEMPT_COUNT_SQL,
              _UNRESOLVED_ATTEMPT_STATES,
          ).fetchone()
          '''
          if old not in text:
              raise SystemExit("unresolved count block not found")
          text = text.replace(old, new, 1)

          old = '''                marks = ",".join("?" for _ in _UNRESOLVED_ATTEMPT_STATES)
                  unresolved = conn.execute(
                      f"SELECT COUNT(*) AS n FROM dispatch_attempts WHERE state IN ({marks})",
                      _UNRESOLVED_ATTEMPT_STATES,
                  ).fetchone()
          '''
          new = '''                unresolved = conn.execute(
                      _UNRESOLVED_ATTEMPT_COUNT_SQL,
                      _UNRESOLVED_ATTEMPT_STATES,
                  ).fetchone()
          '''
          if old not in text:
              raise SystemExit("reserve unresolved block not found")
          text = text.replace(old, new, 1)

          old = '''                recent = conn.execute(
                      "SELECT COUNT(*) AS n FROM dispatch_attempts "
                      f"WHERE send_started_at >= {_ROLLING_24H_CUTOFF_SQL}"
                  ).fetchone()
          '''
          new = '''                recent = conn.execute(_ROLLING_24H_COUNT_SQL).fetchone()
          '''
          if old not in text:
              raise SystemExit("reserve rolling block not found")
          text = text.replace(old, new, 1)

          old = '''        placeholders = ",".join("?" for _ in missing)
              self._conn.execute(
                  f"UPDATE sessions SET lifecycle='not_visible',last_observed_at=CURRENT_TIMESTAMP "
                  f"WHERE session_id IN ({placeholders})",
                  missing,
              )
          '''
          new = '''        self._conn.executemany(
              "UPDATE sessions SET lifecycle='not_visible',last_observed_at=CURRENT_TIMESTAMP "
              "WHERE session_id=?",
              ((session_id,) for session_id in missing),
          )
          '''
          if old not in text:
              raise SystemExit("snapshot update block not found")
          text = text.replace(old, new, 1)

          forbidden = (
              "_ROLLING_24H_CUTOFF_SQL",
              'marks = ",".join',
              'placeholders = ",".join',
          )
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f"dynamic SQL marker remains: {marker}")

          path.write_text(text, encoding="utf-8")
          PY
          git diff -- src/julesctl/store.py
          test -n "$(git diff --name-only -- src/julesctl/store.py)"
          ruff format .
          ruff check .
          mypy
          pytest --cov=julesctl --cov-branch --cov-fail-under=65
          bandit -r src/julesctl -c pyproject.toml
          python -m pip_audit
      - name: Commit verified fix
        shell: bash
        run: |
          git rm .github/workflows/temporary-store-security.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add src/julesctl/store.py
          git commit -m 'security: eliminate dynamic SQL findings'
          git push origin HEAD:${{ github.ref_name }}
