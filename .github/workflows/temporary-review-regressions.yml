name: Temporary review regression patch

on:
  push:
    branches: [fix/review-contract-regressions]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Apply focused fixes and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("src/julesctl/cli/output.py")
          text = output.read_text(encoding="utf-8")
          old = '    return {"schema": "julesctl.event.v1", **value}\n'
          new = '    return {**value, "schema": "julesctl.event.v1"}\n'
          if old not in text:
              raise SystemExit("event merge marker not found")
          output.write_text(text.replace(old, new, 1), encoding="utf-8")

          config = Path("src/julesctl/config.py")
          text = config.read_text(encoding="utf-8")
          old = '''    return (
              Path(os.environ.get("XDG_STATE_HOME", str(Path.home() / ".local" / "state"))) / "julesctl"
          )
          '''
          new = '''    xdg_state_home = os.environ.get("XDG_STATE_HOME") or str(
              Path.home() / ".local" / "state"
          )
          return Path(xdg_state_home).expanduser() / "julesctl"
          '''
          if old not in text:
              raise SystemExit("XDG state marker not found")
          config.write_text(text.replace(old, new, 1), encoding="utf-8")

          store = Path("src/julesctl/store.py")
          text = store.read_text(encoding="utf-8")
          marker = ')\n\n_SCHEMA_VERSION = 1\n'
          insertion = (
              ')\n\n'
              '_ROLLING_24H_CUTOFF_SQL = "strftime(\'%Y-%m-%dT%H:%M:%SZ\',\'now\',\'-24 hours\')"\n\n'
              '_SCHEMA_VERSION = 1\n'
          )
          if marker not in text:
              raise SystemExit("store constant marker not found")
          text = text.replace(marker, insertion, 1)
          old_query = (
              '            "SELECT COUNT(*) AS n FROM dispatch_attempts "\n'
              '            "WHERE send_started_at >= datetime(\'now\',\'-24 hours\')"\n'
          )
          new_query = (
              '            "SELECT COUNT(*) AS n FROM dispatch_attempts "\n'
              '            f"WHERE send_started_at >= {_ROLLING_24H_CUTOFF_SQL}"\n'
          )
          if text.count(old_query) != 2:
              raise SystemExit(f"expected two rolling-window queries, found {text.count(old_query)}")
          text = text.replace(old_query, new_query)
          store.write_text(text, encoding="utf-8")

          steering = Path("tests/test_steering.py")
          text = steering.read_text(encoding="utf-8")
          old = '            state = "IN_PROGRESS" if posted else "AWAITING_PLAN_APPROVAL"\n'
          new = '            state = "AWAITING_PLAN_APPROVAL"\n'
          if old not in text:
              raise SystemExit("approval activity test marker not found")
          text = text.replace(old, new, 1)
          extra = '''

          def test_approval_lost_response_reconciles_from_state_transition_only() -> None:
              posted = False

              def handler(request: httpx.Request) -> httpx.Response:
                  nonlocal posted
                  if request.method == "POST":
                      posted = True
                      return httpx.Response(503, json={"error": {"status": "UNAVAILABLE"}})
                  if request.url.path.endswith("/sessions/1"):
                      state = "IN_PROGRESS" if posted else "AWAITING_PLAN_APPROVAL"
                      return httpx.Response(
                          200,
                          json={"name": "sessions/1", "id": "1", "state": state},
                      )
                  return httpx.Response(
                      200,
                      json={
                          "activities": [
                              {
                                  "name": "sessions/1/activities/plan",
                                  "id": "plan",
                                  "planGenerated": {},
                              }
                          ]
                      },
                  )

              api = JulesApiClient(
                  "k",
                  base_url="https://test",
                  transport=httpx.MockTransport(handler),
              )
              try:
                  result = approve_once(api, "1")
                  assert result["outcome"] == "reconciled"
                  assert result["observed_state"] == "IN_PROGRESS"
              finally:
                  api.close()
          '''
          if "test_approval_lost_response_reconciles_from_state_transition_only" not in text:
              text += extra
          steering.write_text(text, encoding="utf-8")

          Path("tests/test_review_regressions.py").write_text(
              '''from __future__ import annotations

          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          import pytest

          from julesctl.cli.output import event
          from julesctl.config import state_root
          from julesctl.domain.errors import AdmissionError
          from julesctl.store import StateStore


          def _attempt() -> dict[str, object]:
              return {
                  "title": "x",
                  "prompt_sha256": "sha256:x",
                  "automation_mode": "AUTO_CREATE_PR",
                  "require_plan_approval": False,
                  "environment_variables_enabled": None,
              }


          def _reserve(
              store: StateStore,
              *,
              key: str,
              attempt_id: str,
              max_starts_24h: int | None = None,
          ) -> None:
              store.reserve_work(
                  dispatch_key=key,
                  fingerprint=f"fingerprint:{key}",
                  attempt_id=attempt_id,
                  request_fingerprint=f"request:{key}",
                  attempt=_attempt(),
                  baseline_session_ids=[],
                  max_starts_24h=max_starts_24h,
              )


          def _timestamp(hours_ago: int) -> str:
              value = datetime.now(UTC) - timedelta(hours=hours_ago)
              return value.isoformat(timespec="microseconds").replace("+00:00", "Z")


          def test_event_schema_cannot_be_overridden() -> None:
              value = event(
                  {
                      "schema": "attacker-controlled",
                      "type": "completed",
                      "session_id": "123",
                  }
              )
              assert value["schema"] == "julesctl.event.v1"


          def test_empty_xdg_state_home_uses_home_default(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              monkeypatch.delenv("JULESCTL_HOME", raising=False)
              monkeypatch.setenv("XDG_STATE_HOME", "")
              monkeypatch.setattr(Path, "home", classmethod(lambda cls: tmp_path))
              assert state_root() == tmp_path / ".local" / "state" / "julesctl"


          def test_rolling_start_window_uses_rfc3339_cutoff(tmp_path: Path) -> None:
              store = StateStore(tmp_path / "state.db")
              try:
                  _reserve(store, key="old", attempt_id="old")
                  store.begin_send("old", send_started_at=_timestamp(25))
                  assert store.starts_last_24h() == 0

                  _reserve(store, key="recent", attempt_id="recent", max_starts_24h=1)
                  store.begin_send("recent", send_started_at=_timestamp(23))
                  assert store.starts_last_24h() == 1

                  with pytest.raises(AdmissionError, match="rolling start budget"):
                      _reserve(
                          store,
                          key="blocked",
                          attempt_id="blocked",
                          max_starts_24h=1,
                      )
              finally:
                  store.close()
          ''',
              encoding="utf-8",
          )
          PY
          ruff format .
          ruff check --fix .
          mypy
          pytest
      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'fix: close review contract regressions'
          git push origin HEAD:${{ github.ref_name }}
