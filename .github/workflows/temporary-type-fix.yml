name: Temporary type fix

on:
  push:
    branches: [chore/repo-quality-ratchet]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Repair candidate row typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/controller.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import json\n",
              "import json\nimport sqlite3\n",
              1,
          )
          text = text.replace(
              "def _candidate_matches(self, attempt: object, session: SessionWire) -> bool:",
              "def _candidate_matches(self, attempt: sqlite3.Row, session: SessionWire) -> bool:",
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          mypy
      - name: Commit type fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'fix(types): type dispatch reconciliation rows'
          git push origin HEAD:${{ github.ref_name }}
