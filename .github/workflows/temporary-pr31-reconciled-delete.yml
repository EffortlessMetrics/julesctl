name: Temporary PR31 reconciled delete fix

on:
  push:
    branches: [fix/exact-prune-redacted-results]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,security]'
      - name: Reconcile absent delete state in the local ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/julesctl/application/prune.py")
          text = path.read_text(encoding="utf-8")
          marker = "                reconciled_absent.append(session_id)\n"
          replacement = (
              "                store.mark_deleted(session_id)\n"
              "                reconciled_absent.append(session_id)\n"
          )
          if "store.mark_deleted(session_id)" in text:
              raise SystemExit("reconciled delete state is already present")
          if text.count(marker) != 1:
              raise SystemExit(f"expected one reconciled-absence marker, found {text.count(marker)}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          ruff format .
          ruff check .
          mypy
          pytest --cov=julesctl --cov-branch --cov-fail-under=65
          bandit -r src/julesctl -c pyproject.toml
          python -m pip_audit
      - name: Commit verified fix
        shell: bash
        run: |
          git rm .github/workflows/temporary-pr31-reconciled-delete.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'fix(prune): reconcile absent targets in local state'
          git push origin HEAD:${{ github.ref_name }}
