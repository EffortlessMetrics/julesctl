name: Temporary PR31 test alignment

on:
  push:
    branches: [fix/exact-prune-redacted-results]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,security]'
      - name: Align verification-error receipt expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_prune.py")
          text = path.read_text(encoding="utf-8")
          old = '''        assert result["verification_error"] == {
              "kind": "settle_verification_failed",
              "message": "read failed",
              "http_status": 503,
              "api_status": "UNAVAILABLE",
          }
          '''
          new = '''        assert result["verification_error"] == {
              "kind": "settle_verification_failed",
              "message": "read failed",
              "error_type": "ApiError",
              "http_status": 503,
              "api_status": "UNAVAILABLE",
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one verification receipt block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff format .
          ruff check .
          mypy
          pytest --cov=julesctl --cov-branch --cov-fail-under=65
          bandit -r src/julesctl -c pyproject.toml
          python -m pip_audit
      - name: Commit verified alignment
        shell: bash
        run: |
          git rm .github/workflows/temporary-pr31-test-fix.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'test(prune): align verification error receipts'
          git push origin HEAD:${{ github.ref_name }}
