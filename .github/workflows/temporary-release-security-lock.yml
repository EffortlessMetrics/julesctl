name: Temporary release and security lock patch

on:
  push:
    branches: [chore/release-security-lock]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Apply and verify release/security lock
        shell: bash
        run: |
          tr '_-' '/+' < .github/phase21.url.b64 | base64 -d | gzip -d > /tmp/phase21.patch
          git apply --3way /tmp/phase21.patch
          ruff format .
          ruff check --fix .
          mypy
          pytest --cov=julesctl --cov-branch --cov-fail-under=65
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/phase21.url.b64 .github/workflows/temporary-release-security-lock.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git commit -m 'chore: lock release and security evidence'
          git push origin HEAD:${{ github.ref_name }}
