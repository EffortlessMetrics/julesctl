name: Jules API drift

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Validate current Discovery operation surface
        run: |
          python - <<'PY'
          from julesctl.discovery import fetch_discovery
          payload, summary = fetch_discovery()
          print(f"revision={summary.revision}")
          print(f"digest={summary.digest}")
          print(f"operations={len(summary.operations)}")
          print("\n".join(summary.operations))
          if not summary.compatible:
              raise SystemExit(f"missing expected Jules operations: {summary.missing_expected}")
          if summary.unexpected:
              print(f"::warning::new Jules operations require review: {summary.unexpected}")
          PY
