name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Check changed transport surface formatting
        run: >-
          ruff format --check
          src/julesctl/api/client.py
          src/julesctl/discovery.py
          src/julesctl/timestamps.py
          tests/test_api.py
          tests/test_discovery.py
          tests/test_timestamps.py
      - name: Check changed transport surface lint
        run: >-
          ruff check
          src/julesctl/api/client.py
          src/julesctl/discovery.py
          src/julesctl/timestamps.py
          tests/test_api.py
          tests/test_discovery.py
          tests/test_timestamps.py
      - name: Check changed transport surface types
        run: >-
          mypy
          src/julesctl/api/client.py
          src/julesctl/discovery.py
          src/julesctl/timestamps.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src/julesctl
      - run: pytest --cov=julesctl --cov-branch

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/julesctl-wheel
          /tmp/julesctl-wheel/bin/python -m pip install dist/*.whl
          /tmp/julesctl-wheel/bin/julesctl --help

  gate:
    if: always()
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI lanes
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$QUALITY" = success
          test "$TEST" = success
          test "$BUILD" = success
